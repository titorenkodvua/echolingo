<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
</head>
<body>
    <h1>Echolingo API Test</h1>
    <button onclick="testDraftCreation()">Test Draft Creation</button>
    <button onclick="testGetDrafts()">Test Get Drafts</button>
    <div id="result"></div>

    <script>
        async function testDraftCreation() {
            try {
                const response = await fetch('/api/materials/draft', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title: 'Test Material from Frontend',
                        sourceLanguage: 'en',
                        targetLanguage: ['ru'],
                        userId: 'anonymous'
                    })
                });
                
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }

        async function testGetDrafts() {
            try {
                const response = await fetch('/api/materials/drafts?userId=anonymous');
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
